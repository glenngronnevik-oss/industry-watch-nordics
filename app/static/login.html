<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Industry Watch Sign In</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--text:#16202c;--muted:#5b6778;--border:#dde2e9;--accent:#0b5cad;--err:#b4232f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141b;--surface:#171e27;--text:#e6ebf1;--muted:#9aa6b5;--border:#2a3441;--accent:#5aa2ec;--err:#f17e88}}
:root[data-theme="dark"]{--bg:#0f141b;--surface:#171e27;--text:#e6ebf1;--muted:#9aa6b5;--border:#2a3441;--accent:#5aa2ec;--err:#f17e88}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px}
h1{font-size:22px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:22px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--err);font-size:13.5px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<main class="box">
  <h1>Industry Watch</h1>
  <p id="hint">Enter your PIN to view the dashboard.</p>
  <form id="f" autocomplete="off" novalidate>
    <label for="pin">PIN</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" required autofocus>
    <button id="go" type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
